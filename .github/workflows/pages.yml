name: Pages

# Builds the page and publishes it. The Pages source must be set to "GitHub
# Actions" rather than a branch: dist/ only exists after `node build.mjs`, and
# it is not committed.
#
# No secrets. The page installs yamc-core from PyPI at the version
# vendor/YAMC_CORE_VERSION pins, and the CodeMirror bundle is committed under
# vendor/, so the build needs nothing but Node.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, queued rather than cancelled, so a merge is never
# published over by an older run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build
        run: node build.mjs | tee -a $GITHUB_STEP_SUMMARY

      - name: Verify it runs
        # Runs the examples in Chromium, with yamc-core installed from PyPI,
        # against the published data that scripts/fetch-fixtures.mjs lists
        # (light neutron nuclides, H and O photon data, the transmutation
        # chain), fetched once up front and served locally, and checks the
        # tally and inventory values, the plots, the error paths, Stop,
        # drafts, share links, and that nothing but Pyodide and PyPI is
        # fetched from another origin.
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/fetch-fixtures.mjs .fixtures
          YAMC_FIXTURES=.fixtures node verify.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: page
          path: |
            dist/
            verify.png

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
